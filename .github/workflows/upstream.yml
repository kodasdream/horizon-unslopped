# Horizon Unslopped follows gerdaroot/Horizon-Offline-Launcher: when it publishes a launcher release,
# this repository merges the upstream change into its own `main` and cuts its own `launcher@X.Y.Z`
# release, built from this fork's source. Installed launchers update themselves from those releases
# only, so the UI this fork rewrote stays; an upstream release can add a fix but can never put the
# old night-sky look back.
#
# The merge is mechanical: `git merge --no-ff upstream/main`. When it conflicts (upstream touched a
# file this fork rewrote), the job fails on purpose and opens a pull request-shaped issue saying
# which files need a person; nothing half-merged is ever published.
name: follow upstream

on:
  schedule:
    # Every six hours: the launcher release train is at most a few a week, so this is often enough
    # and cheap (the job exits in seconds when there is nothing new).
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report whether upstream has a launcher release this fork lacks
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: follow-upstream
  cancel-in-progress: false

env:
  UPSTREAM: gerdaroot/Horizon-Offline-Launcher
  # The release line this fork publishes on (`launcher@X.Y.Z`), kept in one place.
  LAUNCHER_PREFIX: launcher@

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: What upstream has
        id: upstream
        run: |
          set -euo pipefail
          gh api "repos/$UPSTREAM/releases?per_page=100" > releases.json
          # The newest upstream launcher tag, whatever its release state: that is the change to take.
          newest=$(gh api "repos/$UPSTREAM/git/matching-refs/tags/$LAUNCHER_PREFIX" \
            --jq '.[].ref' | sed 's|refs/tags/||' | sort -V | tail -1)
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
          echo "Upstream's newest launcher tag: ${newest:-none}"
          # This fork's newest launcher tag.
          ours=$(git tag -l "$LAUNCHER_PREFIX*" | sort -V | tail -1)
          echo "ours=$ours" >> "$GITHUB_OUTPUT"
          echo "This fork's newest launcher tag: ${ours:-none}"
          if [ -z "$newest" ]; then
            echo "nothing=1" >> "$GITHUB_OUTPUT"
          elif [ "$newest" = "$ours" ]; then
            echo "nothing=1" >> "$GITHUB_OUTPUT"
          else
            echo "nothing=0" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream
        id: merge
        if: steps.upstream.outputs.nothing == '0' && inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name "horizon-unslopped"
          git config user.email "cservidzsombor@gmail.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --no-tags upstream main
          if git merge --no-ff --no-edit upstream/main; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            # Leave the tree exactly as it was: a conflicted merge is never pushed.
            git merge --abort || true
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            git diff --name-only upstream/main...HEAD > conflicted.txt || true
            out=$( (git merge-tree --write-tree HEAD upstream/main 2>/dev/null || true) \
              | grep -E '^[-+]{7} |CONFLICT' | head -40 || true)
            { echo 'files<<EOF'; cat conflicted.txt; echo 'EOF'; } >> "$GITHUB_OUTPUT"
            { echo 'conflicts<<EOF'; echo "$out"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          fi

      - name: Push the merge
        if: steps.merge.outputs.status == 'merged'
        run: |
          set -euo pipefail
          git push origin HEAD:main
          echo "pushed $(git rev-parse --short HEAD)"

      - name: Guard the look
        id: guard
        if: steps.merge.outputs.status == 'merged'
        run: |
          set -euo pipefail
          # A clean merge can still undo the redesign: if upstream edits the same tokens back to
          # their old values on lines this fork did not touch, git takes them silently. So the
          # tokens themselves are checked, not the merge: the violet, the sky ramp and the pixel
          # type must stay gone.
          fail=0
          say() { echo "::error::$1"; fail=1; }
          t=crates/horizon-theme/src/night.rs
          grep -q 'pub const NIGHT: Night = Night {' "$t" || say "$t: the NIGHT palette is gone"
          # The old look's violet accent and its pale-lavender ink.
          grep -qiE 'accent: 0x(7656fa|5b3fd6|9a86ff)|accent_hi: 0xa08cff' "$t" \
            && say "$t: a violet accent came back; this fork's is a slate blue (0x5b7cfa)"
          # The old sky ramp (violet to sunset), drawn as six bands over every page.
          grep -q 'sky: \[0x07061a' "$t" && say "$t: the night sky ramp came back"
          # The pixel display face and the stepped-corner cut, in the launcher's frame.
          for f in launcher/src/shell.rs launcher/src/plate.rs launcher/src/blocks.rs; do
            [ -f "$f" ] || { say "$f: missing"; continue; }
          done
          grep -q 'pub fn cut(' launcher/src/plate.rs || say "launcher/src/plate.rs: plate::cut is gone (Home and the pages call it)"
          grep -q 'PIXEL_CORNER' crates/horizon-theme/src/night.rs || true
          # The look's tests must still pass: they hold the palette to WCAG AA and the accent.
          [ "$fail" -eq 0 ] || { echo "The merge would change the look; nothing was published."; exit 1; }
          echo "The look is intact."

      - name: Tag and release
        id: release
        if: steps.merge.outputs.status == 'merged' && steps.guard.outcome == 'success'
        run: |
          set -euo pipefail
          newest="${{ steps.upstream.outputs.newest }}"
          base="${newest#$LAUNCHER_PREFIX}"
          # Keep upstream's version line (launcher@1.3.0 and on): the release takes the same
          # MAJOR.MINOR and moves the patch past both upstream's newest and this fork's own, so a
          # launcher on either side sees it as newer. Never a four-part revision: upstream's
          # parser accepts one, but the line stays three numbers.
          line="${base%.*}"
          patch="${base##*.}"
          mine=$(git tag -l "${LAUNCHER_PREFIX}${line}.*" | sed "s|^${LAUNCHER_PREFIX}${line}\.||" \
            | grep -E '^[0-9]+$' | sort -n | tail -1)
          [ -n "${mine:-}" ] && [ "$mine" -gt "$patch" ] && patch="$mine"
          tag="${LAUNCHER_PREFIX}${line}.$(( patch + 1 ))"
          # Never publish below what this fork already has: an upstream patch on an older line
          # would otherwise go out as a downgrade, and no installed launcher would take it.
          newest_mine=$(git tag -l "$LAUNCHER_PREFIX*" | sort -V | tail -1)
          if [ -n "$newest_mine" ]; then
            higher=$(printf '%s\n%s\n' "$newest_mine" "$tag" | sort -V | tail -1)
            if [ "$higher" = "$newest_mine" ]; then
              line="${newest_mine#$LAUNCHER_PREFIX}"; line="${line%.*}"
              patch="${newest_mine##*.}"
              tag="${LAUNCHER_PREFIX}${line}.$(( patch + 1 ))"
            fi
          fi
          while git rev-parse -q --verify "refs/tags/$tag" > /dev/null; do
            patch=$(( patch + 1 ))
            tag="${LAUNCHER_PREFIX}${line}.$(( patch + 1 ))"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git tag -a "$tag" -m "Horizon Unslopped ${tag#$LAUNCHER_PREFIX}: follows upstream $newest"
          git push origin "$tag"
          echo "Tagged $tag (following upstream $newest)"

      - name: Report a conflict
        if: steps.merge.outputs.status == 'conflict' || steps.guard.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Upstream published a launcher release this fork could not merge cleanly, so no new',
              'release was published: the new UI stays as it is until someone merges it by hand.',
              '',
              `Upstream tag: \`${process.env.NEWEST}\``,
              '',
              'Files changed since upstream:',
              '```',
              process.env.FILES || '(unknown)',
              '```',
              '',
              'Conflicting hunks:',
              '```',
              process.env.CONFLICTS || '(none reported)',
              '```',
              '',
              'To take it: `git fetch upstream main && git merge upstream/main`, resolve the UI files,',
              'then push `main` and tag `launcher@<version>`. The launcher release workflow builds and',
              'signs it.',
            ].join('\n');
            const title = `Upstream launcher ${process.env.NEWEST} needs a manual merge`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 50,
            });
            const found = open.data.find((i) => i.title === title);
            if (!found) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
        env:
          NEWEST: ${{ steps.upstream.outputs.newest }}
          FILES: ${{ steps.merge.outputs.files }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        # `env` above may read earlier steps' outputs; `script` runs after them.

      - name: Nothing to do
        if: steps.upstream.outputs.nothing == '1'
        run: echo "This fork already has upstream's newest launcher tag."
